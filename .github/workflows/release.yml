name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE & Create Release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Pytest Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest --tb=short -q

      - name: Build Executable with PyInstaller
        run: |
          python scripts/build_exe.py

      - name: Create Release ZIP Archive
        shell: pwsh
        run: |
          # Tag wydania: z wypchniętego taga v*, a przy ręcznym uruchomieniu (Run workflow) z APP_VERSION w recorder/config.py
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $m = Select-String -Path "recorder/config.py" -Pattern '^APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
            $tag = "v" + $m.Matches[0].Groups[1].Value
          }
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $version = $tag -replace '[/\\:]', '-'
          $zipName = "EMANAGER-Signal-$version-Windows.zip"
          Compress-Archive -Path "dist/EMANAGER-Signal/*" -DestinationPath $zipName -Force
          Write-Host "Utworzono paczke zip: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMANAGER-Signal-Windows
          path: dist/EMANAGER-Signal
          if-no-files-found: error

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build_log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}

